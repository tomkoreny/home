# T-Mobile ACHO remote access (CHCRM/xCarol vDC, prod and test).
#
# SSL VPN (openfortivpn) on TCP 443 has timed out since 2026-10-31 12:24;
# T-Mobile suspected a recent FortiOS update but never confirmed the cause.
# These are the dial-up IPsec settings František Bureš
# (T-Mobile) sent on 2026-11-06 as FortiClient screenshots: IKEv2, the gateway
# authenticates with a pre-shared key and the user with an EAP login,
# mode-config address, IKE on UDP 4500, DH group 20 (ecp384), DPD and NAT-T.
# The PSK and the EAP password live in secrets/vpn/tmobile-ipsec.conf.
connections {
  tmobile {
    version = 2
    remote_addrs = 194.108.108.4
    # FortiClient's "IKE UDP Port" is 4500, so IKE starts there with NAT-T
    # framing instead of on 500; ESP always rides in UDP on the same port.
    remote_port = 4500
    encap = yes
    mobike = no
    vips = 0.0.0.0
    # Phase 1: AES256 + SHA256, or AES256-GCM + PRF-SHA512.
    proposals = aes256-sha256-ecp384, aes256gcm16-prfsha512-ecp384
    rekey_time = 24h
    # Detects a dead tunnel; the child's dpd_action then reconnects.
    dpd_delay = 30s
    keyingtries = 0

    local {
      auth = eap
      eap_id = korenyt
    }
    remote {
      auth = psk
    }

    children {
      tmobile {
        # Split tunnel: harbor, rancher and Kibana (10.10.3.x) and
        # test-rancher (10.20.0.67). A wider range would also capture the
        # home LAN (10.10.60.x).
        remote_ts = 10.10.3.0/24, 10.20.0.0/24
        # Phase 2: AES256 + SHA256, or AES256-GCM; PFS with group 20.
        esp_proposals = aes256-sha256-ecp384, aes256gcm16-ecp384
        rekey_time = 12h
        start_action = start
        dpd_action = restart
        close_action = start
      }
    }
  }
}
