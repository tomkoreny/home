name: Update flake inputs

on:
  schedule:
    - cron: '0 4 * * *'  # Daily 4am UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep validation reproducible instead of silently changing Nix semantics
      # whenever ubuntu-latest starts shipping a newer installer release.
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.3/install

      - name: Update flake.lock
        run: |
          nix --version
          nix flake update

      # Never push a lock that doesn't evaluate — every machine's auto-upgrade
      # would pull it.
      #
      # `nix flake check` alone is a weaker gate than it looks. It understands a
      # fixed set of output schemas: nixosConfigurations is deep-checked, but
      # darwinConfigurations and homeConfigurations are only visited, and on the
      # pinned nix 2.31.3 a `throw` inside either still exits 0. That asymmetry
      # is exactly why this job caught a removed services.i2pd option in the
      # NixOS config while an nvf assertion in the home configs sailed past.
      #
      # So instantiate every host explicitly rather than trusting the schema
      # list. `nix eval` of a drvPath instantiates without building, which is
      # what lets an ubuntu runner vet the two darwin hosts. --all-systems keeps
      # the check itself from skipping aarch64-darwin outputs such as formatter.
      - name: Validate
        run: |
          nix flake check --all-systems path:.
          for attr in \
            'nixosConfigurations.nixos.config.system.build.toplevel' \
            'darwinConfigurations.macos.system' \
            'homeConfigurations."tom@macos".activationPackage' \
            'homeConfigurations."tom@nixos".activationPackage' \
            'homeConfigurations."terka@nixos".activationPackage'; do
            echo "instantiating $attr"
            nix eval --raw "path:.#$attr.drvPath" > /dev/null
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
          else
            git add flake.lock
            git commit -m "flake.lock: daily update"
            git push
          fi

      # A failing scheduled run is invisible: this job was red for three days in
      # August 2026 while nixosConfigurations.nixos could not evaluate, and the
      # only symptom was that lock bumps quietly stopped arriving. Reuse one
      # issue instead of filing a fresh one every morning.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Flake input update is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file - <<EOF
          The daily flake input update stopped validating, so nothing is being
          pushed and every host stays on the last good lock until this passes.

          First failing run: $RUN_URL
          EOF
