name: Update flake inputs

on:
  schedule:
    - cron: '17 * * * *'  # Hourly, away from the busy start of the hour
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep validation reproducible instead of silently changing Nix semantics
      # whenever ubuntu-latest starts shipping a newer installer release.
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.3/install

      # `nix flake update` only moves inputs that track a branch. Release pins
      # (a version plus a fixed-output hash, or a tag in a flake URL) are
      # invisible to it, which is how Helium sat seven months behind. The script
      # moves them to upstream's latest release first, so the lock below picks
      # up bumped tags; majors and boot-critical pins open an issue instead.
      - name: Bump pinned versions
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SUMMARY: ${{ runner.temp }}/pin-bumps.txt
        run: python3 .github/scripts/bump-pins.py

      - name: Update flake.lock
        run: |
          nix --version
          nix flake update

      # Never push a lock that doesn't evaluate or build — every machine's
      # auto-upgrade would pull it. A pin bump that breaks either check must not
      # hold back the lock update too, so revert the bumps, re-lock, report
      # them in an issue, and check again without them.
      - name: Validate
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SUMMARY: ${{ runner.temp }}/pin-bumps.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/validate.sh || {
            .github/scripts/revert-pin-bumps.sh "stopped evaluating"
            .github/scripts/validate.sh
          }

      - name: Build moving packages
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_SUMMARY: ${{ runner.temp }}/pin-bumps.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "No changes to build"
            exit 0
          fi
          .github/scripts/build-moving.sh || {
            .github/scripts/revert-pin-bumps.sh "failed to build"
            .github/scripts/build-moving.sh
          }

      - name: Commit and push
        env:
          BUMP_SUMMARY: ${{ runner.temp }}/pin-bumps.txt
        run: |
          git config user.name "Tom Koreny"
          git config user.email "tom@tomkoreny.com"
          if git diff --quiet; then
            echo "No changes to flake inputs or pins"
          elif [ -s "$BUMP_SUMMARY" ]; then
            git commit -a -m "chore: bump pinned versions and flake inputs" -m "$(cat "$BUMP_SUMMARY")"
            git push
          else
            git commit -a -m "flake.lock: update inputs"
            git push
          fi

      # A failing scheduled run is invisible: this job was red for three days in
      # August 2026 while nixosConfigurations.nixos could not evaluate, and the
      # only symptom was that lock bumps quietly stopped arriving. Reuse one
      # issue instead of filing a fresh one every morning.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Flake input update is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file - <<EOF
          The scheduled flake input update stopped validating or building, so nothing is being
          pushed and every host stays on the last good lock until this passes.

          First failing run: $RUN_URL
          EOF
